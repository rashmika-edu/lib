<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Pro | School Library Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: #f8fafc; height: 100vh; overflow: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .input-field { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1); color: white; padding: 0.75rem 1rem; border-radius: 12px; outline: none; transition: 0.3s; width: 100%; }
        .input-field:focus { border-color: #6366f1; background: rgba(0, 0, 0, 0.4); }
        .modal { backdrop-filter: blur(15px); display: none; position: fixed; inset: 0; z-index: 3000; align-items: center; justify-content: center; padding: 1.5rem; }
        .modal.active { display: flex; }
        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="flex p-6 gap-6">

    <div id="auth-screen" class="fixed inset-0 z-[4000] bg-slate-950 flex items-center justify-center p-6">
        <div class="glass p-10 rounded-[2.5rem] w-full max-w-md text-center">
            <h2 class="text-3xl font-black mb-8">Lumina Pro</h2>
            <div id="login-form" class="space-y-3">
                <input type="email" id="login-email" placeholder="Email" class="input-field">
                <input type="password" id="login-pass" placeholder="Password" class="input-field">
                <button onclick="handleLogin()" class="w-full bg-white text-black font-bold py-4 rounded-xl hover:bg-indigo-50 transition">Sign In</button>
            </div>
        </div>
    </div>

    <aside id="sidebar" class="hidden glass w-72 rounded-[2rem] flex flex-col p-8 shrink-0">
        <div class="flex items-center gap-3 mb-12"><span class="text-xl font-bold">Lumina Pro</span></div>
        <nav class="flex-1 space-y-2">
            <button onclick="switchView('dash')" class="w-full text-left px-5 py-3 rounded-xl hover:bg-white/5 transition font-bold text-slate-400 hover:text-white">Dashboard</button>
            <button onclick="switchView('books')" class="w-full text-left px-5 py-3 rounded-xl hover:bg-white/5 transition font-bold text-slate-400 hover:text-white">Inventory</button>
            <button onclick="handleLogout()" class="w-full text-left px-5 py-3 rounded-xl hover:bg-red-500/10 transition text-red-400 font-bold mt-10">Logout</button>
        </nav>
        <div class="pt-6 border-t border-white/5 mt-auto">
            <p id="user-display-name" class="text-sm font-bold">User</p>
            <p id="user-display-role" class="text-[10px] text-indigo-400 font-bold uppercase">Role</p>
        </div>
    </aside>

    <main id="main-content" class="hidden flex-1 flex flex-col gap-6 overflow-hidden">
        
        <section id="view-dash" class="space-y-6 overflow-y-auto pr-2">
            <h2 class="text-3xl font-extrabold">System Insights</h2>
            <div class="glass p-8 rounded-3xl">
                <p class="text-slate-500 text-xs font-bold uppercase">Total Resources</p>
                <h3 id="stat-books" class="text-4xl font-black">0</h3>
            </div>
            <div class="glass p-8 rounded-3xl">
                <h2 class="text-xl font-bold mb-4">Recent Activity</h2>
                <div id="history-list" class="space-y-2 text-xs"></div>
            </div>
        </section>

        <section id="view-books" class="hidden flex-1 glass rounded-3xl p-8 flex flex-col overflow-hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">Inventory</h2>
                <div class="flex gap-4">
                    <button id="btn-add-book" onclick="openModal('add-book-modal')" class="hidden bg-emerald-600 px-5 py-2 rounded-xl font-bold text-xs">+ Add Asset</button>
                    <button id="btn-issue" onclick="openModal('issue-modal')" class="hidden bg-indigo-600 px-5 py-2 rounded-xl font-bold text-xs">Issue</button>
                </div>
            </div>
            <div class="overflow-y-auto flex-1">
                <table class="w-full text-left">
                    <thead class="text-[10px] uppercase text-slate-500 font-bold sticky top-0 bg-[#020617] p-4">
                        <tr><th class="p-4">Title</th><th class="p-4">Status</th><th class="p-4">Issued To</th><th class="p-4 text-right">Actions</th></tr>
                    </thead>
                    <tbody id="book-rows"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="add-book-modal" class="modal">
        <div class="glass p-10 rounded-[2.5rem] w-full max-w-md">
            <h3 class="text-xl font-bold mb-6">New Resource</h3>
            <input type="text" id="new-book-title" placeholder="Title" class="input-field mb-4">
            <input type="text" id="new-book-isbn" placeholder="ISBN (Optional)" class="input-field mb-6">
            <div class="flex gap-3">
                <button onclick="closeModal('add-book-modal')" class="flex-1 py-3 text-slate-400 font-bold">Cancel</button>
                <button onclick="submitAddBook()" class="flex-1 bg-emerald-600 rounded-xl font-bold">Save Asset</button>
            </div>
        </div>
    </div>

    <div id="issue-modal" class="modal">
        <div class="glass p-10 rounded-[2.5rem] w-full max-w-md">
            <h3 class="text-xl font-bold mb-6">Issue Resource</h3>
            <select id="issue-book-select" class="input-field mb-4 bg-slate-900"></select>
            <input type="text" id="issue-student" placeholder="Student Name" class="input-field mb-6">
            <div class="flex gap-3">
                <button onclick="closeModal('issue-modal')" class="flex-1 py-3 text-slate-400 font-bold">Cancel</button>
                <button onclick="submitIssue()" class="flex-1 bg-indigo-600 rounded-xl font-bold">Confirm Issue</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://cuhkmivwjghclqlkehys.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_IaqT2F1n6UlUZ-vhIAfOWA_O1gNvDiu";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let userProfile = null;
        let allBooks = [];

        window.onload = async () => {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) fetchProfile(session.user);
        };

        async function handleLogin() {
            const { data, error } = await _supabase.auth.signInWithPassword({
                email: document.getElementById('login-email').value,
                password: document.getElementById('login-pass').value
            });
            if (error) alert(error.message); else fetchProfile(data.user);
        }

        async function fetchProfile(u) {
            const { data } = await _supabase.from('profiles').select('*').eq('id', u.id).single();
            if (data) { userProfile = data; renderApp(); }
        }

        function renderApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('sidebar').classList.remove('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            document.getElementById('user-display-name').innerText = userProfile.full_name;
            document.getElementById('user-display-role').innerText = userProfile.role;

            if (userProfile.role === 'Admin' || userProfile.role === 'Librarian') {
                document.getElementById('btn-add-book').classList.remove('hidden');
                document.getElementById('btn-issue').classList.remove('hidden');
            }
            fetchData();
        }

        async function fetchData() {
            const { data: books } = await _supabase.from('books').select('*').order('created_at', { ascending: false });
            const { data: history } = await _supabase.from('history').select('*').order('created_at', { ascending: false }).limit(10);
            allBooks = books || [];
            document.getElementById('stat-books').innerText = allBooks.length;
            renderBooks(allBooks);
            renderHistory(history || []);
        }

        function renderBooks(list) {
            document.getElementById('book-rows').innerHTML = list.map(b => `
                <tr class="border-b border-white/5">
                    <td class="p-4 font-bold text-sm">${b.title}</td>
                    <td class="p-4"><span class="px-2 py-1 rounded text-[10px] font-bold ${b.status === 'AVAILABLE' ? 'text-emerald-400 bg-emerald-400/10' : 'text-indigo-400 bg-indigo-400/10'}">${b.status}</span></td>
                    <td class="p-4 text-xs opacity-60">${b.issued_to || '-'}</td>
                    <td class="p-4 text-right">
                        ${b.status === 'LOANED' ? `<button onclick="handleReturn(${b.id})" class="text-[10px] font-bold text-emerald-400 border border-emerald-400/30 px-3 py-1 rounded-lg">Return</button>` : ''}
                    </td>
                </tr>
            `).join('');
            document.getElementById('issue-book-select').innerHTML = '<option value="">Select Asset...</option>' + 
                allBooks.filter(b => b.status === 'AVAILABLE').map(b => `<option value="${b.id}">${b.title}</option>`).join('');
        }

        function renderHistory(list) {
            document.getElementById('history-list').innerHTML = list.map(h => `
                <div class="p-2 border-b border-white/5 flex justify-between">
                    <span><b>${h.action}</b>: ${h.book_title} (${h.person_name})</span>
                    <span class="opacity-40">${new Date(h.created_at).toLocaleTimeString()}</span>
                </div>
            `).join('');
        }

        async function submitAddBook() {
            const t = document.getElementById('new-book-title').value;
            const i = document.getElementById('new-book-isbn').value;
            if(!t) return alert("Title required");

            const { error } = await _supabase.from('books').insert([{ 
                title: t, isbn: i, status: 'AVAILABLE', user_id: userProfile.id 
            }]);

            if (error) alert("Error: " + error.message); else { closeModal('add-book-modal'); fetchData(); }
        }

        async function submitIssue() {
            const select = document.getElementById('issue-book-select');
            const bid = select.value;
            const bTitle = select.options[select.selectedIndex].text;
            const student = document.getElementById('issue-student').value;

            if (!bid || !student) return alert("Select a book and student.");

            const { error } = await _supabase.from('books').update({ status: 'LOANED', issued_to: student }).eq('id', bid);
            
            if (!error) {
                await _supabase.from('history').insert([{ book_title: bTitle, action: 'ISSUED', person_name: student, staff_name: userProfile.full_name }]);
                closeModal('issue-modal'); fetchData();
            } else alert(error.message);
        }

        async function handleReturn(id) {
            const book = allBooks.find(b => b.id === id);
            const { error } = await _supabase.from('books').update({ status: 'AVAILABLE', issued_to: null }).eq('id', id);
            if (!error) {
                await _supabase.from('history').insert([{ book_title: book.title, action: 'RETURNED', person_name: book.issued_to, staff_name: userProfile.full_name }]);
                fetchData();
            }
        }

        function switchView(id) { ['dash', 'books'].forEach(v => document.getElementById(`view-${v}`).classList.add('hidden')); document.getElementById(`view-${id}`).classList.remove('hidden'); }
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        async function handleLogout() { await _supabase.auth.signOut(); window.location.reload(); }
    </script>
</body>
</html>
