<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Pro | School Library Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: #f8fafc; height: 100vh; overflow: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .input-field { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1); color: white; padding: 0.75rem 1rem; border-radius: 12px; outline: none; }
        .modal { backdrop-filter: blur(10px); display: none; }
        .modal.active { display: flex; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="flex p-6 gap-6">

    <div id="login-screen" class="fixed inset-0 z-[2000] bg-slate-950 flex items-center justify-center p-6">
        <div class="glass p-10 rounded-[2.5rem] w-full max-w-md text-center">
            <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-xl shadow-indigo-500/20">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            </div>
            <h2 class="text-3xl font-black mb-2">Lumina Pro</h2>
            <p class="text-slate-400 mb-8">Enterprise Resource Management</p>
            <div class="space-y-3">
                <input type="email" id="login-email" placeholder="Email Address" class="input-field w-full">
                <input type="password" id="login-pass" placeholder="Password" class="input-field w-full">
                <button onclick="handleLogin()" id="login-btn" class="w-full bg-white text-black font-bold py-4 rounded-xl hover:bg-indigo-50 transition-all">Sign In</button>
            </div>
        </div>
    </div>

    <aside id="sidebar" class="hidden glass w-72 rounded-[2rem] flex flex-col p-8 shrink-0">
        <div class="flex items-center gap-3 mb-12">
            <span class="text-xl font-bold tracking-tight">Lumina Pro</span>
        </div>
        <nav class="flex-1 space-y-2">
            <button onclick="switchView('dash')" class="w-full text-left px-5 py-3 rounded-xl hover:bg-white/5 transition text-slate-400 hover:text-white">Dashboard</button>
            <button onclick="switchView('books')" class="w-full text-left px-5 py-3 rounded-xl hover:bg-white/5 transition text-slate-400 hover:text-white">Inventory</button>
            <button id="nav-admin" onclick="switchView('users')" class="hidden w-full text-left px-5 py-3 rounded-xl hover:bg-white/5 transition text-slate-400 hover:text-white">Staff Registry</button>
        </nav>
        <button onclick="handleLogout()" class="mt-auto text-xs text-slate-500 hover:text-red-400 transition text-left px-5">Logout Session</button>
        <div class="pt-6 border-t border-white/5 mt-4">
            <div class="flex items-center gap-3">
                <div id="user-initial" class="w-10 h-10 rounded-full bg-indigo-500 flex items-center justify-center font-bold">?</div>
                <div>
                    <p id="user-display-name" class="text-sm font-bold truncate w-32">User</p>
                    <p id="user-display-role" class="text-[10px] text-indigo-400 font-bold uppercase">Role</p>
                </div>
            </div>
        </div>
    </aside>

    <main id="main-content" class="hidden flex-1 flex flex-col gap-6 overflow-hidden">
        <section id="view-dash" class="space-y-6">
            <h2 class="text-3xl font-extrabold">System Insights</h2>
            <div class="grid grid-cols-3 gap-6">
                <div class="glass p-8 rounded-3xl">
                    <p class="text-slate-500 text-xs font-bold uppercase">Assets</p>
                    <h3 id="stat-books" class="text-4xl font-black">0</h3>
                </div>
                <div class="glass p-8 rounded-3xl">
                    <p class="text-slate-500 text-xs font-bold uppercase">Staff</p>
                    <h3 id="stat-users" class="text-4xl font-black text-purple-400">0</h3>
                </div>
            </div>
        </section>

        <section id="view-books" class="hidden flex-1 glass rounded-3xl p-8 flex flex-col overflow-hidden">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-bold">Inventory</h2>
                <button id="btn-issue" onclick="openModal('issue-modal')" class="hidden bg-indigo-600 px-6 py-3 rounded-xl font-bold text-sm">+ Issue</button>
            </div>
            <div class="overflow-y-auto">
                <table class="w-full text-left">
                    <tbody id="book-rows" class="divide-y divide-white/5"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        // --- PERMANENT CONFIG ---
        const SUPABASE_URL = "https://cuhkmivwjghclqlkehys.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_IaqT2F1n6UlUZ-vhIAfOWA_O1gNvDiu";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let userProfile = null;

        // Check if user is already logged in on page load
        window.onload = async () => {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) fetchProfile(session.user);
        };

        async function handleLogin() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-pass').value;
            const btn = document.getElementById('login-btn');
            
            btn.innerText = "Authenticating...";
            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

            if (error) {
                alert(error.message);
                btn.innerText = "Sign In";
            } else {
                fetchProfile(data.user);
            }
        }

        async function fetchProfile(authUser) {
            const { data, error } = await _supabase
                .from('profiles')
                .select('*')
                .eq('id', authUser.id)
                .single();

            if (data) {
                userProfile = data;
                renderApp();
            }
        }

        function renderApp() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('sidebar').classList.remove('hidden');
            document.getElementById('main-content').classList.remove('hidden');

            document.getElementById('user-display-name').innerText = userProfile.full_name;
            document.getElementById('user-display-role').innerText = userProfile.role;
            document.getElementById('user-initial').innerText = userProfile.full_name.charAt(0);

            // ROLE BASED UI
            if (userProfile.role === 'Admin') {
                document.getElementById('nav-admin').classList.remove('hidden');
                document.getElementById('btn-issue').classList.remove('hidden');
            } else if (userProfile.role === 'Librarian') {
                document.getElementById('btn-issue').classList.remove('hidden');
            }

            // Start Data Fetch
            fetchData();
        }

        async function fetchData() {
            const { data: books } = await _supabase.from('books').select('*');
            const { data: staff } = await _supabase.from('profiles').select('*');
            
            document.getElementById('stat-books').innerText = books?.length || 0;
            document.getElementById('stat-users').innerText = staff?.length || 0;

            document.getElementById('book-rows').innerHTML = books?.map(b => `
                <tr>
                    <td class="p-4 font-bold">${b.title}</td>
                    <td class="p-4"><span class="text-xs ${b.status === 'AVAILABLE' ? 'text-emerald-400' : 'text-indigo-400'}">${b.status}</span></td>
                </tr>
            `).join('') || '';
        }

        async function handleLogout() {
            await _supabase.auth.signOut();
            window.location.reload();
        }

        function switchView(id) {
            ['dash', 'books'].forEach(v => document.getElementById(`view-${v}`).classList.add('hidden'));
            document.getElementById(`view-${id}`).classList.remove('hidden');
        }
    </script>
</body>
</html>
