<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Pro | Enterprise Resource Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: #f8fafc; height: 100vh; overflow: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .input-field { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1); color: white; padding: 0.75rem 1rem; border-radius: 12px; outline: none; transition: 0.3s; }
        .input-field:focus { border-color: #6366f1; background: rgba(0, 0, 0, 0.4); }
        .hidden { display: none !important; }
        
        /* Smooth transitions for auth toggle */
        #auth-container { transition: all 0.5s ease; }
    </style>
</head>
<body class="flex p-6 gap-6">

    <div id="auth-screen" class="fixed inset-0 z-[2000] bg-slate-950 flex items-center justify-center p-6">
        <div id="auth-container" class="glass p-10 rounded-[2.5rem] w-full max-w-md text-center">
            <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-xl shadow-indigo-500/20">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            </div>
            
            <div id="login-form">
                <h2 class="text-3xl font-black mb-2">Welcome Back</h2>
                <p class="text-slate-400 mb-8 text-sm">Sign in to manage your resources</p>
                <div class="space-y-3">
                    <input type="email" id="login-email" placeholder="Email Address" class="input-field w-full">
                    <input type="password" id="login-pass" placeholder="Password" class="input-field w-full">
                    <button onclick="handleLogin()" id="login-btn" class="w-full bg-white text-black font-bold py-4 rounded-xl hover:bg-indigo-50 transition-all">Sign In</button>
                    <p class="text-xs text-slate-500 pt-4">Don't have an account? <a href="#" onclick="toggleAuth(true)" class="text-indigo-400 font-bold">Register Now</a></p>
                </div>
            </div>

            <div id="register-form" class="hidden">
                <h2 class="text-3xl font-black mb-2">Create Account</h2>
                <p class="text-slate-400 mb-8 text-sm">Join the enterprise network</p>
                <div class="space-y-3 text-left">
                    <input type="text" id="reg-name" placeholder="Full Name" class="input-field w-full">
                    <input type="email" id="reg-email" placeholder="Email Address" class="input-field w-full">
                    <input type="password" id="reg-pass" placeholder="Password" class="input-field w-full">
                    <select id="reg-role" class="input-field w-full bg-slate-900">
                        <option value="Teacher">Teacher</option>
                        <option value="Librarian">Librarian</option>
                        <option value="Admin">Admin</option>
                    </select>
                    <button onclick="handleRegister()" id="reg-btn" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl hover:bg-indigo-500 transition-all mt-4">Create Account</button>
                    <p class="text-xs text-slate-500 pt-4 text-center">Already registered? <a href="#" onclick="toggleAuth(false)" class="text-indigo-400 font-bold">Sign In</a></p>
                </div>
            </div>
        </div>
    </div>

    <aside id="sidebar" class="hidden glass w-72 rounded-[2rem] flex flex-col p-8 shrink-0">
        <div class="flex items-center gap-3 mb-12">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <span class="text-xl font-bold tracking-tight">Lumina Pro</span>
        </div>

        <nav class="flex-1 space-y-2">
            <button onclick="switchView('dash')" class="w-full text-left px-5 py-3 rounded-xl hover:bg-white/5 transition text-slate-400 hover:text-white">Dashboard</button>
            <button onclick="switchView('books')" class="w-full text-left px-5 py-3 rounded-xl hover:bg-white/5 transition text-slate-400 hover:text-white">Inventory</button>
            <button id="nav-admin" onclick="switchView('users')" class="hidden w-full text-left px-5 py-3 rounded-xl hover:bg-white/5 transition text-slate-400 hover:text-white">Staff Registry</button>
            
            <button onclick="handleLogout()" class="w-full text-left px-5 py-3 rounded-xl hover:bg-red-500/10 transition text-red-400 font-bold mt-10">
                Logout Session
            </button>
        </nav>

        <div class="pt-6 border-t border-white/5 mt-auto">
            <div class="flex items-center gap-3 mb-6">
                <div id="user-initial" class="w-10 h-10 rounded-full bg-indigo-500 flex items-center justify-center font-bold">?</div>
                <div>
                    <p id="user-display-name" class="text-sm font-bold truncate w-32">User</p>
                    <p id="user-display-role" class="text-[10px] text-indigo-400 font-bold uppercase">Role</p>
                </div>
            </div>
            <p class="text-[10px] text-slate-600 leading-relaxed font-medium">
                © 2026 <br> Developer By K.A.V.Rashmika
            </p>
        </div>
    </aside>

    <main id="main-content" class="hidden flex-1 flex flex-col gap-6 overflow-hidden">
        <section id="view-dash" class="space-y-6">
            <h2 class="text-3xl font-extrabold">System Insights</h2>
            <div class="grid grid-cols-3 gap-6">
                <div class="glass p-8 rounded-3xl">
                    <p class="text-slate-500 text-xs font-bold uppercase">Total Assets</p>
                    <h3 id="stat-books" class="text-4xl font-black">0</h3>
                </div>
                <div class="glass p-8 rounded-3xl">
                    <p class="text-slate-500 text-xs font-bold uppercase">Staff Members</p>
                    <h3 id="stat-users" class="text-4xl font-black text-purple-400">0</h3>
                </div>
            </div>
        </section>

        <section id="view-books" class="hidden flex-1 glass rounded-3xl p-8 flex flex-col overflow-hidden">
            <h2 class="text-2xl font-bold mb-8">Inventory</h2>
            <div class="overflow-y-auto">
                <table class="w-full text-left">
                    <tbody id="book-rows" class="divide-y divide-white/5"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        // REPLACE WITH YOUR ACTUAL PERMANENT CREDENTIALS
        const SUPABASE_URL = "https://cuhkmivwjghclqlkehys.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_IaqT2F1n6UlUZ-vhIAfOWA_O1gNvDiu";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let userProfile = null;

        window.onload = async () => {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) fetchProfile(session.user);
        };

        // --- AUTH LOGIC ---

        function toggleAuth(showReg) {
            document.getElementById('login-form').classList.toggle('hidden', showReg);
            document.getElementById('register-form').classList.toggle('hidden', !showReg);
        }

        async function handleRegister() {
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-pass').value;
            const fullName = document.getElementById('reg-name').value;
            const role = document.getElementById('reg-role').value;
            const btn = document.getElementById('reg-btn');

            if(!email || !password || !fullName) return alert("Please fill all fields");

            btn.innerText = "Creating Account...";
            
            // Sign up with Metadata so the Trigger can pick up full_name and role
            const { data, error } = await _supabase.auth.signUp({
                email,
                password,
                options: {
                    data: { full_name: fullName, role: role }
                }
            });

            if (error) {
                alert(error.message);
                btn.innerText = "Create Account";
            } else {
                alert("Registration successful! You can now sign in.");
                toggleAuth(false);
            }
        }

        async function handleLogin() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-pass').value;
            const btn = document.getElementById('login-btn');
            
            btn.innerText = "Authenticating...";
            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

            if (error) {
                alert(error.message);
                btn.innerText = "Sign In";
            } else {
                fetchProfile(data.user);
            }
        }

        async function fetchProfile(authUser) {
            const { data, error } = await _supabase.from('profiles').select('*').eq('id', authUser.id).single();
            if (data) {
                userProfile = data;
                renderApp();
            }
        }

        function renderApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('sidebar').classList.remove('hidden');
            document.getElementById('main-content').classList.remove('hidden');

            document.getElementById('user-display-name').innerText = userProfile.full_name;
            document.getElementById('user-display-role').innerText = userProfile.role;
            document.getElementById('user-initial').innerText = userProfile.full_name.charAt(0);

            if (userProfile.role === 'Admin') document.getElementById('nav-admin').classList.remove('hidden');
            fetchData();
        }

        async function fetchData() {
            const { data: books } = await _supabase.from('books').select('*');
            const { data: staff } = await _supabase.from('profiles').select('*');
            document.getElementById('stat-books').innerText = books?.length || 0;
            document.getElementById('stat-users').innerText = staff?.length || 0;
            document.getElementById('book-rows').innerHTML = books?.map(b => `
                <tr><td class="p-4 font-bold">${b.title}</td><td class="p-4 text-xs opacity-50">${b.status}</td></tr>
            `).join('') || '';
        }

        async function handleLogout() {
            await _supabase.auth.signOut();
            window.location.reload();
        }

        function switchView(id) {
            ['dash', 'books'].forEach(v => document.getElementById(`view-${v}`).classList.add('hidden'));
            document.getElementById(`view-${id}`).classList.remove('hidden');
        }
    </script>
</body>
</html>
