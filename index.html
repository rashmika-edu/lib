<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Pro | School Library Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: #f8fafc; height: 100vh; overflow: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .input-field { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1); color: white; padding: 0.75rem 1rem; border-radius: 12px; outline: none; transition: 0.3s; }
        .input-field:focus { border-color: #6366f1; background: rgba(0, 0, 0, 0.4); }
        .modal { backdrop-filter: blur(15px); display: none; }
        .modal.active { display: flex; }
        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="flex p-6 gap-6">

    <div id="auth-screen" class="fixed inset-0 z-[2000] bg-slate-950 flex items-center justify-center p-6">
        <div id="auth-container" class="glass p-10 rounded-[2.5rem] w-full max-w-md text-center">
            <div id="login-form">
                <h2 class="text-3xl font-black mb-2">Lumina Pro</h2>
                <div class="space-y-3 mt-8">
                    <input type="email" id="login-email" placeholder="Email Address" class="input-field w-full">
                    <input type="password" id="login-pass" placeholder="Password" class="input-field w-full">
                    <button onclick="handleLogin()" id="login-btn" class="w-full bg-white text-black font-bold py-4 rounded-xl hover:bg-indigo-50 transition">Sign In</button>
                    <p class="text-xs text-slate-500 pt-4">Need an account? <a href="#" onclick="toggleAuth(true)" class="text-indigo-400 font-bold">Register</a></p>
                    
                    <div class="pt-6 border-t border-white/5 mt-4">
                        <a href="https://wa.me/94788932009?text=Hello%20Lumina%20Support,%20I%20need%20help%20with%20logging%20in." target="_blank" class="text-xs text-slate-400 hover:text-emerald-400 transition flex items-center justify-center gap-2">
                            <span>Chat with Support</span>
                        </a>
                    </div>
                </div>
            </div>
            <div id="register-form" class="hidden text-left">
                <h2 class="text-3xl font-black mb-2 text-center">Create Account</h2>
                <div class="space-y-3 mt-6">
                    <input type="text" id="reg-name" placeholder="Full Name" class="input-field w-full">
                    <input type="email" id="reg-email" placeholder="Email Address" class="input-field w-full">
                    <input type="password" id="reg-pass" placeholder="Password" class="input-field w-full">
                    <select id="reg-role" class="input-field w-full bg-slate-900">
                        <option value="Teacher">Teacher</option>
                        <option value="Librarian">Librarian</option>
                    </select>
                    <button onclick="handleRegister()" id="reg-btn" class="w-full bg-indigo-600 font-bold py-4 rounded-xl mt-4 hover:bg-indigo-500 transition">Register</button>
                    <p class="text-xs text-slate-500 pt-4 text-center">Back to <a href="#" onclick="toggleAuth(false)" class="text-indigo-400 font-bold">Sign In</a></p>
                </div>
            </div>
        </div>
    </div>

    <aside id="sidebar" class="hidden glass w-72 rounded-[2rem] flex flex-col p-8 shrink-0">
        <div class="flex items-center gap-3 mb-12">
            <span class="text-xl font-bold tracking-tight">Lumina Pro</span>
        </div>
        <nav class="flex-1 space-y-2">
            <button onclick="switchView('dash')" class="w-full text-left px-5 py-3 rounded-xl hover:bg-white/5 transition text-slate-400 hover:text-white font-bold">Dashboard</button>
            <button onclick="switchView('books')" class="w-full text-left px-5 py-3 rounded-xl hover:bg-white/5 transition text-slate-400 hover:text-white font-bold">Inventory</button>
            <button id="nav-admin" onclick="switchView('users')" class="hidden w-full text-left px-5 py-3 rounded-xl hover:bg-white/5 transition text-slate-400 hover:text-white font-bold">Staff Registry</button>
            
            <a href="https://wa.me/1234567890?text=Hi%20Lumina%20Support,%20I%27m%20currently%20using%20the%20Dashboard%20and%20need%20assistance." target="_blank" class="block w-full text-left px-5 py-3 rounded-xl hover:bg-emerald-500/10 transition text-emerald-400 font-bold border border-emerald-500/20 mt-4">WhatsApp Support</a>
            
            <button onclick="handleLogout()" class="w-full text-left px-5 py-3 rounded-xl hover:bg-red-500/10 transition text-red-400 font-bold mt-10">Logout</button>
        </nav>
        <div class="pt-6 border-t border-white/5 mt-auto">
            <div class="flex items-center gap-3 mb-6">
                <div id="user-initial" class="w-10 h-10 rounded-full bg-indigo-500 flex items-center justify-center font-bold uppercase text-sm">?</div>
                <div>
                    <p id="user-display-name" class="text-sm font-bold truncate w-32">User</p>
                    <p id="user-display-role" class="text-[10px] text-indigo-400 font-bold uppercase">Role</p>
                </div>
            </div>
            <p class="text-[10px] text-slate-600 leading-relaxed font-semibold">© 2026 <br> Developer By K.A.V.Rashmika</p>
        </div>
    </aside>

    <main id="main-content" class="hidden flex-1 flex flex-col gap-6 overflow-hidden">
        <section id="view-dash" class="space-y-6">
            <h2 class="text-3xl font-extrabold">System Insights</h2>
            <div class="grid grid-cols-1 gap-6">
                <div class="glass p-8 rounded-3xl">
                    <p class="text-slate-500 text-xs font-bold uppercase">Total Resources</p>
                    <h3 id="stat-books" class="text-4xl font-black">0</h3>
                </div>
            </div>
        </section>

        <section id="view-books" class="hidden flex-1 glass rounded-3xl p-8 flex flex-col overflow-hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">Inventory</h2>
                <div class="flex gap-4">
                    <input type="text" id="isbn-search" onkeyup="filterByISBN()" placeholder="Search ISBN..." class="input-field text-sm w-64">
                    <button id="btn-add-book" onclick="openModal('add-book-modal')" class="hidden bg-emerald-600 px-5 py-2 rounded-xl font-bold text-xs hover:bg-emerald-500 transition">+ Add Asset</button>
                    <button id="btn-issue" onclick="openModal('issue-modal')" class="hidden bg-indigo-600 px-5 py-2 rounded-xl font-bold text-xs hover:bg-indigo-500 transition">Issue</button>
                </div>
            </div>
            <div class="overflow-y-auto flex-1">
                <table class="w-full text-left">
                    <thead class="text-[10px] uppercase text-slate-500 font-bold sticky top-0 bg-[#020617] z-10">
                        <tr><th class="p-4">Title</th><th class="p-4">ISBN</th><th class="p-4">Status</th><th class="p-4">Issued To</th><th id="th-actions" class="p-4 hidden text-right">Actions</th></tr>
                    </thead>
                    <tbody id="book-rows" class="divide-y divide-white/5"></tbody>
                </table>
            </div>
        </section>

        <section id="view-users" class="hidden flex-1 glass rounded-3xl p-8 overflow-y-auto">
            <h2 class="text-2xl font-bold mb-6">Staff Control Registry</h2>
            <div id="staff-list" class="grid grid-cols-2 gap-6"></div>
        </section>
    </main>

    <script>
        const SUPABASE_URL = "https://cuhkmivwjghclqlkehys.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_IaqT2F1n6UlUZ-vhIAfOWA_O1gNvDiu";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let userProfile = null;
        let allBooks = [];

        window.onload = async () => {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) fetchProfile(session.user);
        };

        async function handleLogin() {
            const e = document.getElementById('login-email').value;
            const p = document.getElementById('login-pass').value;
            const { data, error } = await _supabase.auth.signInWithPassword({ email: e, password: p });
            if (error) alert(error.message); else fetchProfile(data.user);
        }

        async function handleRegister() {
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            const role = document.getElementById('reg-role').value;
            if (!name || !email || !pass) return alert("Please fill all fields");
            const { data, error } = await _supabase.auth.signUp({
                email: email, password: pass,
                options: { data: { full_name: name, role: role } }
            });
            if (error) alert(error.message); else { alert("Registration successful! You can now sign in."); toggleAuth(false); }
        }

        async function fetchProfile(u) {
            const { data } = await _supabase.from('profiles').select('*').eq('id', u.id).single();
            if (data) { userProfile = data; renderApp(); }
        }

        function renderApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('sidebar').classList.remove('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            document.getElementById('user-display-name').innerText = userProfile.full_name;
            document.getElementById('user-display-role').innerText = userProfile.role;
            document.getElementById('user-initial').innerText = userProfile.full_name.charAt(0);
            if (userProfile.role === 'Admin') {
                document.getElementById('nav-admin').classList.remove('hidden');
                document.getElementById('btn-add-book').classList.remove('hidden');
            }
            if (userProfile.role === 'Admin' || userProfile.role === 'Librarian') {
                document.getElementById('btn-issue').classList.remove('hidden');
                document.getElementById('th-actions').classList.remove('hidden');
            }
            fetchData();
        }

        async function fetchData() {
            const { data: books } = await _supabase.from('books').select('*').order('created_at', { ascending: false });
            const { data: staff } = await _supabase.from('profiles').select('*').order('full_name');
            allBooks = books || [];
            document.getElementById('stat-books').innerText = allBooks.length;
            renderBooks(allBooks);
            renderStaff(staff || []);
        }

        function renderBooks(list) {
            const isStaff = (userProfile.role === 'Admin' || userProfile.role === 'Librarian');
            document.getElementById('book-rows').innerHTML = list.map(b => `
                <tr class="hover:bg-white/[0.02] transition">
                    <td class="p-4 font-bold text-sm">${b.title}</td>
                    <td class="p-4 text-xs font-mono opacity-50">${b.isbn || 'N/A'}</td>
                    <td class="p-4"><span class="px-2 py-1 rounded text-[10px] font-bold ${b.status === 'AVAILABLE' ? 'text-emerald-400 bg-emerald-400/10' : 'text-indigo-400 bg-indigo-400/10'}">${b.status}</span></td>
                    <td class="p-4 text-xs opacity-60">${b.issued_to || '-'}</td>
                    ${isStaff ? `<td class="p-4 text-right space-x-2">
                        ${b.status === 'LOANED' ? `<button onclick="handleReturn(${b.id})" class="text-[10px] font-bold text-emerald-400 border border-emerald-400/30 px-3 py-1 rounded-lg hover:bg-emerald-500 hover:text-white transition">Return</button>` : ''}
                        ${userProfile.role === 'Admin' ? `<button onclick="handleDeleteBook(${b.id})" class="text-[10px] font-bold text-red-400 border border-red-400/30 px-3 py-1 rounded-lg hover:bg-red-500 hover:text-white transition">Delete</button>` : ''}
                    </td>` : ''}
                </tr>
            `).join('');
            document.getElementById('issue-book-select').innerHTML = '<option value="">Select Asset...</option>' + allBooks.filter(b => b.status === 'AVAILABLE').map(b => `<option value="${b.id}">${b.title}</option>`).join('');
        }

        function renderStaff(staff) {
            const isAdmin = (userProfile.role === 'Admin');
            document.getElementById('staff-list').innerHTML = staff.map(s => `
                <div class="glass p-6 rounded-[2rem] border border-white/5 flex flex-col gap-4">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-2xl bg-indigo-600/20 flex items-center justify-center font-bold text-indigo-400">${s.full_name.charAt(0)}</div>
                        <div class="flex-1"><p class="font-bold">${s.full_name}</p><p class="text-[10px] text-slate-500 uppercase tracking-widest font-black">${s.role}</p></div>
                    </div>
                    ${isAdmin ? `<div class="pt-4 border-t border-white/5 flex flex-col gap-2"><p class="text-[10px] text-slate-500 font-bold uppercase">Update Role</p><select onchange="handleRoleChange('${s.id}', this.value)" ${s.id === userProfile.id ? 'disabled' : ''} class="input-field w-full text-xs bg-slate-950"><option value="Teacher" ${s.role === 'Teacher' ? 'selected' : ''}>Teacher</option><option value="Librarian" ${s.role === 'Librarian' ? 'selected' : ''}>Librarian</option><option value="Admin" ${s.role === 'Admin' ? 'selected' : ''}>Admin</option></select></div>` : ''}
                </div>
            `).join('');
        }

        async function handleRoleChange(profileId, newRole) {
            if(!confirm(`Confirm changing this user's role to ${newRole}?`)) return fetchData();
            const { error } = await _supabase.from('profiles').update({ role: newRole }).eq('id', profileId);
            if (error) alert(error.message); else fetchData();
        }

        async function submitAddBook() {
            const t = document.getElementById('new-book-title').value;
            const i = document.getElementById('new-book-isbn').value;
            const { error } = await _supabase.from('books').insert([{ title: t, isbn: i, status: 'AVAILABLE' }]);
            if (!error) { closeModal('add-book-modal'); fetchData(); }
        }

        async function submitIssue() {
            const bid = document.getElementById('issue-book-select').value;
            const s = document.getElementById('issue-student').value;
            const { error } = await _supabase.from('books').update({ status: 'LOANED', issued_to: s }).eq('id', bid);
            if (!error) { closeModal('issue-modal'); fetchData(); }
        }

        async function handleReturn(id) { await _supabase.from('books').update({ status: 'AVAILABLE', issued_to: null }).eq('id', id); fetchData(); }
        async function handleDeleteBook(id) { if(confirm("Delete asset?")) { await _supabase.from('books').delete().eq('id', id); fetchData(); } }
        function filterByISBN() { const q = document.getElementById('isbn-search').value.toLowerCase(); renderBooks(allBooks.filter(b => (b.isbn || '').toLowerCase().includes(q))); }
        function toggleAuth(s) { document.getElementById('login-form').classList.toggle('hidden', s); document.getElementById('register-form').classList.toggle('hidden', !s); }
        async function handleLogout() { await _supabase.auth.signOut(); window.location.reload(); }
        function switchView(id) { ['dash', 'books', 'users'].forEach(v => document.getElementById(`view-${v}`).classList.add('hidden')); document.getElementById(`view-${id}`).classList.remove('hidden'); }
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    </script>
</body>
</html>
